^Palettes:
	PaletteFromFile@terrain-temperat:
		Filename: alien.pal
	TintPostProcessEffect:
		Red: 1.3
		Green: 1
		Blue: 1.5
		Ambient: 0.5

^BaseWorld:
	TerrainLighting:

World:
	LuaScript:
		Scripts: campaign.lua, exodus.lua
	MissionData:
		Briefing: We have reached the gateway. GDI have a strong presence surrounding it, but are currently in the process of evacuating.\n\nThe bulk of our forces are holding back the Overlord and Soviets from the north, your goal is to use what forces we can spare to secure the gateway.\n\nWe have also detected Malefic forces amassing nearby, so you have a choice to make.\n\nYou can attempt to hold the Malefic forces back long enough for GDI to retreat through the gateway, or you can attempt to fight your way through GDI to take control of the gateway by force. Analyse the situation and use your best judgement.
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: fwp

Player:
	PlayerResources:
		DefaultCash: 6000

VoidSpikeSpawner:
	Inherits: ^WeaponDetonaterDummy
	PeriodicExplosion:
		Weapon: VoidspikeSpawner
	EditorOnlyTooltip:
		Name: Voidspike Spawner

^EmpMissilePower:
	AttackOrderPowerCA@EMPMISSILE:
		DisplayTimerRelationships: Ally

^IonCannonPower:
	DetonateWeaponPower@IonStorm:
		DisplayTimerRelationships: Ally

^ColonySpikePower:
	DetonateWeaponPower@ColonySpike:
		Prerequisites: ~disabled

colonyspike.provider:
	-UpdatesSupportPowerTimer:

HOSP:
	PeriodicProducerCA@MEDIC:
		RequiresCondition: !is-neutral && !scrinplayer && !owned-by-ai
	PeriodicProducerCA@REJUVENATOR:
		RequiresCondition: !is-neutral && scrinplayer && !owned-by-ai

MACS:
	PeriodicProducerCA@MECHANIC:
		RequiresCondition: !is-neutral && !scrinplayer && !owned-by-ai
	PeriodicProducerCA@ARTIFICER:
		RequiresCondition: !is-neutral && scrinplayer && !owned-by-ai

HQ:
	ExternalCondition@PowerDown:
		Condition: powerdown

EYE:
	ExternalCondition@PowerDown:
		Condition: powerdown

